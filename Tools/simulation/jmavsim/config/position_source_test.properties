# jMAVSim position-source test model. SI units unless explicitly named otherwise.
# This model's lockstep physics and both IMUs run at 250 Hz; do not change one alone.
imu.rate_hz=250
imu.acceleration_std_m_s2=0.05
imu.angular_rate_std_rad_s=0.01
imu1.seed=1001
imu2.seed=1002
mag.std_gauss=0.005
mag.seed=2001
baro.altitude_std_m=0.1
baro.seed=2002

# Bounded, temporally correlated receiver errors; one RTK fixed receiver.
# If delay changes, update the matching SENS_GNSS0_DELAY parameter in PX4.
gnss.rate_hz=20
gnss.delay_ms=200
gnss.horizontal_std_m=0.02
gnss.vertical_std_m=0.03
# Match SIM_GPS_VEL_ERR: HIL_GPS cannot transmit velocity uncertainty.
gnss.velocity_std_m_s=0.05
gnss.correlation_time_s=10
gnss.seed=3001

# Forward-pointing body-X antenna baseline, sampled with GNSS before its delay.
# Match SENS_GNSS0_AUXX (main antenna at body origin).
heading.baseline_m=0.5
heading.minimum_horizontal_m=0.05
# Match SIM_GPS_YAW_ERR: HIL_GPS cannot transmit heading uncertainty.
heading.std_deg=0.5
heading.seed=3002

# Body-down beam intersects the model's horizontal ground plane.
range.rate_hz=20
range.minimum_m=0.1
range.maximum_m=30
range.std_m=0.02
range.seed=4001

# Body FRD attitude and a fixed local NED position/velocity frame.
# If delay changes, update EKF2_EV_DELAY in PX4; do not compensate twice.
vision.rate_hz=25
vision.delay_ms=40
vision.position_std_m=0.05
vision.velocity_std_m_s=0.05
vision.attitude_std_deg=0.5
vision.angular_rate_std_rad_s=0.01
vision.drift_north_m_s=0
vision.drift_east_m_s=0
vision.drift_down_m_s=0
vision.seed=5001
